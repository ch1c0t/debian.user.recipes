unbind C-b
set -g prefix `

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# As suggested in nvim's :checkhealth
set-option -sg escape-time 10
set-option -g default-terminal "tmux-256color"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Moving between panes
# https://unix.stackexchange.com/questions/283759/tmux-how-to-bind-a-key-to-launch-shell-command/480965#480965
bind -n M-h run-shell "to-left-pane"
bind -n M-j run-shell "to-lower-pane"
bind -n M-k run-shell "to-upper-pane"
bind -n M-l run-shell "to-right-pane"

bind S command-prompt -p "New Session:" "new-session -A -s '%%'"

# To move between sessions faster
set-option -g detach-on-destroy off
bind X run-shell "tmux-close-session"
bind-key x kill-pane
bind h switch-client -l
bind -n M-a switch-client -l

bind-key -n F1 copy-mode

# https://unix.stackexchange.com/questions/60968/tmux-bottom-status-bar-color-change
# set the status bar background to a turquoise color
set -g status-bg "#003366"

set -g @session-wizard 's'
run-shell ~/sources/tmux/tmux-session-wizard/session-wizard.tmux

set -g history-limit 10000 # default: 2000

bind C-n display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ./notes'
